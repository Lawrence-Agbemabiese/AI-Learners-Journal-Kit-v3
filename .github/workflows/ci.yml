name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          python-version: "3.13"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Lint Python
        run: uv run ruff check scripts tests

      - name: Check Python formatting
        run: uvx black==25.11.0 --check --diff scripts tests

      - name: Check shell syntax
        run: bash -n ai-journal *.command installers/*.command installers/*.sh scripts/*.sh

      - name: Build Python package
        run: uv build

      - name: Validate customer release package
        run: uv run python scripts/build_release.py --version ci-smoke --allow-dirty

  tests:
    name: Tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Run behavioral tests
        run: uv run pytest -q

  smoke-install:
    name: Installed CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          python-version: "3.13"
          enable-cache: true

      - name: Install CLI in an isolated tool environment
        run: uv tool install .

      - name: Run installed CLI
        run: ai-journal --help

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          python-version: "3.13"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --extra dev --locked

      - name: Scan Python source
        run: uvx bandit==1.9.4 -r scripts --severity-level medium

      - name: Audit runtime dependencies
        run: uvx pip-audit==2.10.1 -r requirements.txt

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [quality, tests, smoke-install, security]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every required job passed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SMOKE_RESULT: ${{ needs.smoke-install.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$SECURITY_RESULT" = success
